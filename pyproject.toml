[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "release-trust-control-plane"
version = "0.1.0"
description = "Admission control for signed multi-platform OCI releases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==44.0.0",
  "fastapi==0.115.6",
  "psycopg[binary]==3.2.3",
  "requests==2.32.3",
  "securesystemslib==1.2.0",
  "sqlalchemy==2.0.36",
  "tuf==5.1.0",
  "uvicorn==0.34.0",
  "watchdog==6.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.8.4",
]

[project.scripts]
release-trust-bootstrap = "release_trust.bootstrap:main"
release-trust-supervisor = "release_trust.supervisor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
